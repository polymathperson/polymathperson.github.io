<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WCMS Countdown</title>
    
    <!-- This is the line that links your new favicon! -->
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    
    <!-- Creepster Font -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
            color: #ff4444;
            text-align: center;
            overflow-x: hidden; 
            cursor: auto; 
        }

        #countdown {
            font-family: 'Creepster', cursive;
            font-size: 110px; 
            color: red !important;
            margin-top: 25vh;
            white-space: nowrap;
            line-height: 1.2;
            transition: text-shadow 0.3s ease-in-out; 
            z-index: 10;
        }
        
        #countdown:hover {
            text-shadow: 0 0 8px red;
        }

        #countup {
            font-size: 24px;
            color: #ff4444;
            margin-bottom: 30px;
            z-index: 10;
        }

        .description {
            font-size: 18px;
            max-width: 800px;
            line-height: 1.5;
            padding: 0 20px;
            z-index: 10;
        }

        /* FOOTER */
        .footer-bar {
            background-color: #000;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            bottom: 0;
            z-index: 20;
        }

        .credit-text { color: #6a0dad; font-size: 16px; }
    </style>
</head>
<body>

    <!-- Header & Timers -->
    <div id="countdown"></div>
    <div id="countup"></div>

    <p class="description">
        The countdown tells how long until June 8th at 11:30 AM, the time we get out of the last day for San Juan students.
    </p>

    <!-- Footer -->
    <div class="footer-bar">
        <div class="credit-text">Countdown made courtesy of Rafa R, WCMS!</div>
    </div>

    <script>
        // --- TIMER LOGIC ---
        // Set target to June 8, 2027, 11:30:00
        const target = new Date("2027-06-08T11:30:00").getTime();
        
        const timer = setInterval(function() {
            const now = new Date().getTime();
            const diff = target - now;
            
            const countdownEl = document.getElementById("countdown");
            const countupEl = document.getElementById("countup");
            
            if (diff <= 0) {
                // The Count-UP Logic
                countdownEl.innerText = "It's Summer!!";
                
                const pastDiff = now - target;
                const totalDays = Math.floor(pastDiff / (1000 * 60 * 60 * 24));
                
                const mo = Math.floor(totalDays / 30);
                const d = totalDays % 30;
                
                const h = Math.floor((pastDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((pastDiff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((pastDiff % (1000 * 60)) / 1000);
                
                countupEl.innerHTML = `Time since school ended:<br>${mo}mo ${d}d ${h}h ${m}m ${s}s`;
            } else {
                // The standard countdown logic
                const totalDays = Math.floor(diff / (1000 * 60 * 60 * 24));
                
                const mo = Math.floor(totalDays / 30);
                const d = totalDays % 30;
                
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                
                countdownEl.innerHTML = "Time until summer:<br>" + mo + "mo " + d + "d " + h + "h " + m + "m " + s + "s ";
                countupEl.innerHTML = "";
            }
        }, 1000);
    </script>
</body>
</html>
