<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WCMS Countdown</title>
    
    <!-- Creepster Font -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    
    <style>
        /* VISUAL UPDATES & CUSTOM CURSOR */
        body {
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
            color: #ff4444;
            text-align: center;
            overflow-x: hidden; 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="red" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>') 12 12, auto;
        }

        /* THE HOVER GLOW EFFECT (Subtle version) */
        #countdown {
            font-family: 'Creepster', cursive;
            font-size: 80px; 
            color: red !important;
            margin-top: 25vh; /* Pushed down to center nicely without the list */
            white-space: nowrap;
            line-height: 1.2;
            transition: text-shadow 0.3s ease-in-out; 
            z-index: 10;
        }
        
        #countdown:hover {
            text-shadow: 0 0 8px red; /* Much softer glow */
        }

        #countup {
            font-size: 24px;
            color: #ff4444;
            margin-bottom: 30px;
            z-index: 10;
        }

        .description {
            font-size: 18px;
            max-width: 800px;
            line-height: 1.5;
            padding: 0 20px;
            z-index: 10;
        }

        /* PARTICLE ANIMATION STYLING */
        .spark {
            position: fixed;
            background-color: red;
            width: 3px;
            height: 10px;
            border-radius: 50%;
            box-shadow: 0 0 5px red;
            pointer-events: none; 
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* FOOTER (Cleaned up) */
        .footer-bar {
            background-color: #000;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            bottom: 0;
            z-index: 20;
        }

        .credit-text { color: #6a0dad; font-size: 16px; }
    </style>
</head>
<body>

    <!-- Header & Timers -->
    <div id="countdown"></div>
    <div id="countup"></div>

    <p class="description">
        The countdown tells how long until June 8th at 11:30 AM, the time we get out of the last day for San Juan students. Survive the school year!
    </p>

    <!-- Footer -->
    <div class="footer-bar">
        <div class="credit-text">Countdown made courtesy of Rafa R, WCMS!</div>
    </div>

    <script>
        // --- TIMER LOGIC ---
        // Set target to June 8, 2027, 11:30:00
        const target = new Date("2027-06-08T11:30:00").getTime();
        
        const timer = setInterval(function() {
            const now = new Date().getTime();
            const diff = target - now;
            
            const countdownEl = document.getElementById("countdown");
            const countupEl = document.getElementById("countup");
            
            if (diff <= 0) {
                // The Count-UP Logic (When summer starts again)
                countdownEl.innerText = "It's Summer!!";
                
                const pastDiff = now - target;
                const totalDays = Math.floor(pastDiff / (1000 * 60 * 60 * 24));
                
                // Calculate Months and remaining days (assuming ~30 days per month)
                const mo = Math.floor(totalDays / 30);
                const d = totalDays % 30;
                
                const h = Math.floor((pastDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((pastDiff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((pastDiff % (1000 * 60)) / 1000);
                
                countupEl.innerHTML = `Time since school ended:<br>${mo}mo ${d}d ${h}h ${m}m ${s}s`;
            } else {
                // The standard countdown logic
                const totalDays = Math.floor(diff / (1000 * 60 * 60 * 24));
                
                // Calculate Months and remaining days
                const mo = Math.floor(totalDays / 30);
                const d = totalDays % 30;
                
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                
                countdownEl.innerHTML = "Time until summer:<br>" + mo + "mo " + d + "d " + h + "h " + m + "m " + s + "s ";
                countupEl.innerHTML = ""; // Clears the countup text
            }
        }, 1000);

        // --- PARTICLE LOGIC ---
        function createSpark() {
            const spark = document.createElement("div");
            spark.classList.add("spark");
            
            spark.style.left = Math.random() * 100 + "vw";
            spark.style.animationDuration = (Math.random() * 3 + 2) + "s"; 
            
            document.body.appendChild(spark);
            
            setTimeout(() => { spark.remove(); }, 5000);
        }
        
        setInterval(createSpark, 300);
    </script>
</body>
</html>
